<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HU · Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=IM+Fell+English:ital@0;1&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #030a0d;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'IM Fell English', serif;
    color: rgba(168,232,224,0.7);
    padding: 2rem;
    overflow: hidden;
  }
  body::before {
    content:'';
    position:fixed; inset:0;
    background: radial-gradient(ellipse 80% 60% at 50% 50%, rgba(78,205,192,0.04) 0%, transparent 65%);
    pointer-events:none; z-index:0;
  }
  .stage {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 600px;
    width: 100%;
  }
  .pre-label {
    font-family: 'Courier Prime', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.55em;
    color: rgba(78,205,192,0.3);
    text-transform: uppercase;
    margin-bottom: 2.5rem;
  }
  .svg-placeholder {
    width: 100%;
    max-width: 420px;
    height: 320px;
    border: 1px dashed rgba(78,205,192,0.25);
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(78,205,192,0.015);
    margin-bottom: 2.5rem;
  }
  .svg-placeholder span {
    font-family: 'Courier Prime', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: rgba(78,205,192,0.4);
  }
  .post-title {
    font-family: 'Cinzel', serif;
    font-size: 0.9rem;
    letter-spacing: 0.3em;
    color: rgba(168,232,224,0.6);
    margin-bottom: 0.6rem;
  }
  .post-sub {
    font-style: italic;
    font-size: 0.85rem;
    color: rgba(78,205,192,0.35);
    letter-spacing: 0.05em;
  }
  .corner {
    position: fixed;
    font-family: 'Courier Prime', monospace;
    font-size: 0.55rem;
    color: rgba(78,205,192,0.15);
    letter-spacing: 0.2em;
  }
  .tl { top: 1.5rem; left: 1.5rem; }
  .tr { top: 1.5rem; right: 1.5rem; }
  .bl { bottom: 1.5rem; left: 1.5rem; }
  .br { bottom: 1.5rem; right: 1.5rem; }
</style>
</head>
<body>
<span class="corner tl">HU · φ²</span>
<span class="corner tr">ℋ</span>
<span class="corner bl">2.618</span>
<span class="corner br">φ⁷</span>
<div class="stage">
  <span class="pre-label">In Vorbereitung · Coming Soon</span>
  <div class="svg-placeholder">
    <span>[ Platzhalter für Start-Grafik ]</span>
  </div>
  <h1 class="post-title">HU · ATEM · GEIST · TRÄGER</h1>
  <p class="post-sub">der erste Hauch vor der Form</p>
</div>
</body>
</html>
