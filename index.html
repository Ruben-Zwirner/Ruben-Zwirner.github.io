<meta charset="UTF-8">

<title>Vandenberg Wiper · HU</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: #030a0d;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
  }

  /* Deep field */
  body::before {
    content:'';
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 50%,
        rgba(78,205,192,0.055) 0%, transparent 65%),
      radial-gradient(ellipse 40% 80% at 20% 50%,
        rgba(26,122,110,0.03) 0%, transparent 55%),
      radial-gradient(ellipse 40% 80% at 80% 50%,
        rgba(26,122,110,0.03) 0%, transparent 55%);
    pointer-events:none; z-index:0;
  }

  /* Grain */
  body::after {
    content:'';
    position:fixed; inset:0;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
    pointer-events:none; z-index:100; opacity:0.45;
  }

  .stage {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    width: 100%;
    max-width: 680px;
    padding: 2rem;
  }

  /* Main SVG: crystallization entrance */
  .stage svg {
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;

    opacity: 0;
    filter: saturate(0.5) brightness(0.8);
    animation: svgEntrance 2.5s ease-out forwards;
    animation-delay: 0.8s;

    width: 100%;
    max-width: 620px;
    height: auto;
    max-height: calc(100vh - 4rem);
    max-height: calc(100dvh - 4rem);
    display: block;
  }

  @keyframes svgEntrance {
    0% {
      opacity: 0;
      transform: scale(0.98);
      filter: saturate(0) brightness(0.5) blur(5px);
    }
    50% {
      opacity: 0.5;
      filter: saturate(0.5) brightness(1.2) blur(2px);
    }
    100% {
      opacity: 1;
      transform: none;
      filter: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .stage svg { animation: none; opacity: 1; filter: none; }
  }

  /* Corner marks */
  .corner {
    position: fixed;
    font-family: 'Courier Prime', monospace;
    font-size: 0.55rem;
    color: rgba(78,205,192,0.12);
    pointer-events: none;
    z-index: 50;
    letter-spacing: 0.2em;
  }
  .tl { top:1.2rem; left:1.2rem; }
  .tr { top:1.2rem; right:1.2rem; }
  .bl { bottom:1.2rem; left:1.2rem; }
  .br { bottom:1.2rem; right:1.2rem; }
</style>
